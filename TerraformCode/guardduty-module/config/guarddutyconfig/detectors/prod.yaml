# ---------------------------------------------------------------------------
# Shared GuardDuty policy for the "prod" account/environment.
#
# THIS FILE IS THE ANSWER TO "how does a new account get its own
# GuardDuty?" - a prod team (or any other account/team) copies dev.yaml
# (or this file), adjusts it, and points terraform.tfvars'
# single_account_config_file at it. No .tf code changes anywhere.
# ---------------------------------------------------------------------------

enable: true
finding_publishing_frequency: FIFTEEN_MINUTES   # prod wants faster finding delivery than dev's SIX_HOURS

tags:
  Environment: prod
  ManagedBy: terraform
  Owner: platform-team

features:
  - name: S3_DATA_EVENTS
    status: ENABLED
  - name: EKS_AUDIT_LOGS
    status: ENABLED
  - name: EBS_MALWARE_PROTECTION
    status: ENABLED
  - name: RDS_LOGIN_EVENTS
    status: ENABLED
  - name: LAMBDA_NETWORK_LOGS
    status: ENABLED

ip_sets: []
threat_intel_sets: []

# Prod stays stricter than dev - no auto-archive filters here, every
# finding gets reviewed rather than silently suppressed by default.
filters: []

# Prod typically DOES export findings, unlike dev - set the real values in
# terraform.tfvars for this account.
enable_publishing: false
