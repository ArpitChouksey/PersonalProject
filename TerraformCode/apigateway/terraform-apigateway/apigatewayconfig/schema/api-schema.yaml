###############################################################################
# Enterprise API Gateway Platform Schema
#
# Version : v1
# Purpose : Generic schema used by every application team
###############################################################################

###############################################################################
# Enable / Disable API
###############################################################################

enabled: true

###############################################################################
# Metadata
###############################################################################

metadata:

  owner:

  team:

  application:

  project:

  environment:

  cost_center:

###############################################################################
# API
###############################################################################

api:

  name:

  description:

  version:

  protocol_type:

###############################################################################
# Stage
###############################################################################

stage:

  name:

  auto_deploy:

###############################################################################
# Endpoint
###############################################################################

endpoint:

  type:

###############################################################################
# CORS
###############################################################################

cors:

  enabled:

  allow_origins:

  allow_methods:

  allow_headers:

  expose_headers:

  allow_credentials:

  max_age:

###############################################################################
# Logging
###############################################################################

logging:

  access_logs:

  execution_logs:

  metrics:

  xray:

  retention_days:

###############################################################################
# Domain
###############################################################################

domain:

  enabled:

  domain_name:

  certificate_arn:

  hosted_zone_id:

###############################################################################
# VPC Link
###############################################################################

vpc:

  enabled:

  vpc_link_id:

###############################################################################
# Security
###############################################################################

security:

  authorization:

    default:

  api_key_required:

###############################################################################
# Authorizers
###############################################################################

authorizers:

  - name:

    type:

    config:

###############################################################################
# Routes
###############################################################################

routes:

  - name:

    path:

    method:

    integration:

    authorization:

###############################################################################
# Integrations
###############################################################################

integrations:

  - name:

    type:

    config:

###############################################################################
# WAF
###############################################################################

waf:

  enabled:

  web_acl_arn:

###############################################################################
# Tags
###############################################################################

tags:
