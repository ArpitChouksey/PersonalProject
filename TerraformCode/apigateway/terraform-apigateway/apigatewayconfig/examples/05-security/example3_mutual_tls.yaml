# yaml-language-server: $schema=../../schema/api-schema.json
#
# SECURITY: Mutual TLS (mTLS)
# Use when: "the caller must present a client certificate we trust"
# Requires a custom domain -- mTLS is configured on the domain,
# not the API itself.

enabled: true

api:
  name: example-mtls
  protocol_type: HTTP

domain:
  enabled: true
  name: mtls-api.company.com
  certificate_arn: arn:aws:acm:us-west-2:111111111111:certificate/example-mtls
  endpoint_type: REGIONAL
  security_policy: TLS_1_2
  base_path: mtls-example
  mtls:
    truststore_uri: s3://my-mtls-truststores/mtls-example-truststore.pem
    truststore_version: "1"

integrations:
  - name: my-lambda
    type: LAMBDA
    config:
      function_arn: arn:aws:lambda:us-west-2:111111111111:function:my-function

routes:
  - path: /secure
    method: GET
    integration: my-lambda
