AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Enterprise CloudFormation Patch Management - Patch Manager Module.
  Windows and Linux patch baselines with 3-tier approval rules.
  Patch Group tag values match what compute.yaml applies to instances.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment

Parameters:

  ProjectName:
    Type: String
    Default: epm

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

Resources:

####################################################
# Windows Patch Baseline
####################################################

  WindowsPatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-windows-baseline"
      OperatingSystem: WINDOWS
      PatchGroups:
        - !Sub "${ProjectName}-${Environment}-windows"
      ApprovalRules:
        PatchRules:
          - PatchFilterGroup:
              PatchFilters:
                - Key: MSRC_SEVERITY
                  Values: [Critical]
            ApproveAfterDays: 0
            ComplianceLevel: CRITICAL
          - PatchFilterGroup:
              PatchFilters:
                - Key: MSRC_SEVERITY
                  Values: [Important]
            ApproveAfterDays: 7
            ComplianceLevel: HIGH
          - PatchFilterGroup:
              PatchFilters:
                - Key: MSRC_SEVERITY
                  Values: [Moderate, Low]
            ApproveAfterDays: 14
            ComplianceLevel: MEDIUM

####################################################
# Linux Patch Baseline
####################################################

  LinuxPatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-linux-baseline"
      OperatingSystem: AMAZON_LINUX_2023
      PatchGroups:
        - !Sub "${ProjectName}-${Environment}-linux"
      ApprovalRules:
        PatchRules:
          - PatchFilterGroup:
              PatchFilters:
                - Key: SEVERITY
                  Values: [Critical]
            ApproveAfterDays: 0
            ComplianceLevel: CRITICAL
          - PatchFilterGroup:
              PatchFilters:
                - Key: SEVERITY
                  Values: [Important]
            ApproveAfterDays: 7
            ComplianceLevel: HIGH
          - PatchFilterGroup:
              PatchFilters:
                - Key: SEVERITY
                  Values: [Medium, Low]
            ApproveAfterDays: 14
            ComplianceLevel: MEDIUM

####################################################
# Outputs
####################################################

Outputs:

  WindowsPatchBaselineId:
    Value: !Ref WindowsPatchBaseline
    Export:
      Name: !Sub "${ProjectName}-${Environment}-WindowsPatchBaselineId"

  LinuxPatchBaselineId:
    Value: !Ref LinuxPatchBaseline
    Export:
      Name: !Sub "${ProjectName}-${Environment}-LinuxPatchBaselineId"
