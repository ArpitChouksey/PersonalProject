AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Enterprise CloudFormation Patch Management - SNS Module.
  Notification topic for patch/compliance/automation alerts.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: Notifications
        Parameters:
          - NotificationEmail

Parameters:

  ProjectName:
    Type: String
    Default: epm

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

  NotificationEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

Resources:

####################################################
# SNS Topic
####################################################

  PatchAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-patch-alerts"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

####################################################
# Email Subscription
####################################################

  PatchAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PatchAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

####################################################
# Topic Policy - allow EventBridge and SSM to publish
####################################################

  PatchAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PatchAlertsTopic
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
                - ssm.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PatchAlertsTopic

####################################################
# Outputs
####################################################

Outputs:

  PatchAlertsTopicArn:
    Description: SNS topic ARN for patch/compliance alerts
    Value: !Ref PatchAlertsTopic
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PatchAlertsTopicArn"
