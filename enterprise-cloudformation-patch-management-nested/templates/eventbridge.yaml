AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Enterprise CloudFormation Patch Management - EventBridge Module.
  Notifies on patch compliance changes and Automation execution failures.
  Deploy after sns.yaml.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment

Parameters:

  ProjectName:
    Type: String
    Default: epm

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

  NotificationTopicArn:
    Type: String
    Description: From SnsStack.Outputs.PatchAlertsTopicArn

Resources:

####################################################
# Patch compliance change -> SNS
####################################################

  PatchComplianceRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-patch-compliance-change"
      Description: Notifies when an instance's patch compliance state changes
      EventPattern:
        source:
          - aws.ssm
        detail-type:
          - "EC2 Instance Patch Compliance Changed"
      Targets:
        - Arn: !Ref NotificationTopicArn
          Id: PatchComplianceTarget

####################################################
# Automation execution failed/timed-out -> SNS
####################################################

  AutomationFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-automation-execution-failed"
      Description: Notifies when a patch/rollback Automation execution fails or times out
      EventPattern:
        source:
          - aws.ssm
        detail-type:
          - "EC2 Automation Execution Status-change Notification"
        detail:
          Status:
            - Failed
            - TimedOut
            - Cancelled
      Targets:
        - Arn: !Ref NotificationTopicArn
          Id: AutomationFailureTarget

####################################################
# Outputs
####################################################

Outputs:

  PatchComplianceRuleName:
    Value: !Ref PatchComplianceRule

  AutomationFailureRuleName:
    Value: !Ref AutomationFailureRule
