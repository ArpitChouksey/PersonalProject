AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Enterprise CloudFormation Patch Management - State Manager Module.
  Continuously verifies the dummy security agent exists and is running;
  reinstalls it if missing. Imports the install-agent document from ssm.yaml.
  Deploy this after ssm.yaml.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment

Parameters:

  ProjectName:
    Type: String
    Default: epm

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

  InstallAgentDocumentName:
    Type: String
    Description: From SsmStack.Outputs.InstallAgentDocumentName

Resources:

  AgentComplianceAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: !Ref InstallAgentDocumentName
      AssociationName: !Sub "${ProjectName}-${Environment}-agent-compliance"
      ScheduleExpression: "rate(1 hour)"
      ComplianceSeverity: CRITICAL
      Targets:
        - Key: tag:Project
          Values:
            - !Ref ProjectName
        - Key: tag:Environment
          Values:
            - !Ref Environment

Outputs:

  AgentComplianceAssociationId:
    Value: !Ref AgentComplianceAssociation
