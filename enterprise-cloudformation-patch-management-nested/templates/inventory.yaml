AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Enterprise CloudFormation Patch Management - Inventory Module.
  Collects installed applications/services/patch-level data for
  troubleshooting and asset visibility. Targets all instances tagged
  with this Project + Environment.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment

Parameters:

  ProjectName:
    Type: String
    Default: epm

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

Resources:

  InventoryAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-GatherSoftwareInventory
      AssociationName: !Sub "${ProjectName}-${Environment}-inventory"
      ScheduleExpression: "rate(12 hours)"
      Targets:
        - Key: tag:Project
          Values:
            - !Ref ProjectName
        - Key: tag:Environment
          Values:
            - !Ref Environment
      Parameters:
        applications: ["Enabled"]
        awsComponents: ["Enabled"]
        networkConfig: ["Enabled"]
        services: ["Enabled"]
        windowsUpdates: ["Enabled"]
        instanceDetailedInformation: ["Enabled"]

Outputs:

  InventoryAssociationId:
    Value: !Ref InventoryAssociation
