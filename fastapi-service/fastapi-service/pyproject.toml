[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project9-fastapi-service"
version = "1.0.0"
description = "Project9 Messaging FastAPI and MCP Service"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]
