apiVersion: apps/v1
kind: Deployment

metadata:
  name: kibana
  namespace: logging

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana

    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.5.1

          ports:
            - containerPort: 5601

          env:
            - name: ELASTICSEARCH_HOSTS
              value: "https://elasticsearch-master.logging.svc.cluster.local:9200"

            - name: ELASTICSEARCH_USERNAME
              value: "elastic"

            - name: ELASTICSEARCH_PASSWORD
              value: "hKgcBLGwLdkVve7X"

            - name: ELASTICSEARCH_SSL_VERIFICATIONMODE
              value: "none"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service

metadata:
  name: kibana
  namespace: logging

spec:
  selector:
    app: kibana

  ports:
    - port: 5601
      targetPort: 5601

  type: ClusterIP

