# ==========================================================
# SERVER
# ==========================================================

server.port=${SERVER_PORT:8080}

# ==========================================================
# SPRING APPLICATION
# ==========================================================

spring.application.name=${SPRING_APPLICATION_NAME:spring-service}

# ==========================================================
# DATASOURCE - POSTGRESQL
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project9_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / HIBERNATE
# ==========================================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================================
# ACTUATOR
# ==========================================================

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info,prometheus,metrics}

management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:always}

management.endpoint.prometheus.access=unrestricted
management.endpoint.mappings.access=unrestricted

management.prometheus.metrics.export.enabled=${PROMETHEUS_ENABLED:true}

# ==========================================================
# PYTHON SERVICE
# ==========================================================

python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}

# ==========================================================
# LOGGING
# ==========================================================

logging.file.name=${LOG_FILE_NAME:/app/logs/application.log}
logging.pattern.console=%d %-5level %logger : %msg%n
logging.pattern.file=%d %-5level %logger : %msg%n

# ==========================================================
# KAFKA
# ==========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:user-service-group}

spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:*}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==========================================================
# MESSAGING
# ==========================================================

messaging.provider=${MESSAGING_PROVIDER:kafka}

messaging.source=${MESSAGING_SOURCE:spring-service}

messaging.destination=${MESSAGING_DESTINATION:user-events}

# ==========================================================
# AMAZON MQ
# ==========================================================

# Disabled by default because Kafka is the current messaging provider.

amazonmq.enabled=${AMAZONMQ_ENABLED:false}

amazonmq.broker-url=${AMAZONMQ_BROKER_URL:}
amazonmq.username=${AMAZONMQ_USERNAME:}
amazonmq.password=${AMAZONMQ_PASSWORD:}

amazonmq.queue=${AMAZONMQ_QUEUE:user-events}

# ==========================================================
# MCP SERVER
# ==========================================================

spring.ai.mcp.server.enabled=${MCP_SERVER_ENABLED:true}

spring.ai.mcp.server.name=${MCP_SERVER_NAME:spring-service-mcp}

spring.ai.mcp.server.version=${MCP_SERVER_VERSION:1.0.0}

spring.ai.mcp.server.instructions=${MCP_SERVER_INSTRUCTIONS:Enterprise Spring Boot MCP Server}

spring.ai.mcp.server.type=${MCP_SERVER_TYPE:SYNC}

spring.ai.mcp.server.streamable-http.mcp-endpoint=${MCP_ENDPOINT:/mcp}

# ==========================================================
# OLLAMA
# ==========================================================

# Only required if Spring Service itself uses Ollama.
# Currently AI MCP Client is the main Ollama consumer.

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:latest}

# ==========================================================
# KUBERNETES HEALTH PROBES
# ==========================================================

management.endpoint.health.probes.enabled=${HEALTH_PROBES_ENABLED:true}

management.endpoint.health.livenessstate.enabled=${LIVENESS_ENABLED:true}

management.endpoint.health.readinessstate.enabled=${READINESS_ENABLED:true}
