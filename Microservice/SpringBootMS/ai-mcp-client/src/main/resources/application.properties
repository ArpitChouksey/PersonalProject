# ==========================================================
# Application
# ==========================================================

spring.application.name=${APP_NAME:ai-mcp-client}
server.port=${SERVER_PORT:8081}


# ==========================================================
# CORS
# ==========================================================

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}


# ==========================================================
# Ollama
# ==========================================================

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}

spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}


# ==========================================================
# MCP Client
# ==========================================================

spring.ai.mcp.client.enabled=${MCP_CLIENT_ENABLED:true}

spring.ai.mcp.client.name=${MCP_CLIENT_NAME:ai-mcp-client}

spring.ai.mcp.client.version=${MCP_CLIENT_VERSION:1.0.0}

spring.ai.mcp.client.type=${MCP_CLIENT_TYPE:SYNC}

spring.ai.mcp.client.initialized=${MCP_CLIENT_INITIALIZED:true}

spring.ai.mcp.client.toolcallback.enabled=${MCP_CLIENT_TOOLCALL_ENABLED:true}

spring.ai.mcp.client.sse.connections.spring-service.url=${MCP_SERVER_URL:http://localhost:8080}

spring.ai.mcp.client.sse.connections.spring-service.sse-endpoint=${MCP_SSE_ENDPOINT:/sse}


# ==========================================================
# PostgreSQL / PGVector
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project9_app}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INITIALIZE_SCHEMA:true}

spring.ai.vectorstore.pgvector.index-type=${PGVECTOR_INDEX_TYPE:HNSW}

spring.ai.vectorstore.pgvector.distance-type=${PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}


# ==========================================================
# RAG
# ==========================================================

rag.project-name=${RAG_PROJECT_NAME:Project9-Messaging}

rag.knowledge-location=${RAG_KNOWLEDGE_LOCATION:classpath:/knowledge/*.md}

rag.chunk-size=${RAG_CHUNK_SIZE:1000}

rag.min-chunk-size-chars=${RAG_MIN_CHUNK_SIZE_CHARS:400}

rag.min-chunk-length-to-embed=${RAG_MIN_CHUNK_LENGTH_TO_EMBED:10}

rag.max-num-chunks=${RAG_MAX_NUM_CHUNKS:5000}

rag.keep-separator=${RAG_KEEP_SEPARATOR:true}


# ==========================================================
# AI Prompt
# ==========================================================

ai.system-prompt=${AI_SYSTEM_PROMPT:You are the Project9-Messaging project assistant. Use retrieved project context as the source of truth. Do not invent project components, configuration, ports, classes, or infrastructure details. If the information is not available in the retrieved project context, clearly say that it is not documented.}
