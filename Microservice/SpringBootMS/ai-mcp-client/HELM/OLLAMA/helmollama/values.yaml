replicaCount: 1

image:
  repository: ollama
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Models are configurable through Helm.
# They will be downloaded automatically when the Ollama pod starts.
models:
  chat: "llama3.2:latest"
  embedding: "nomic-embed-text:latest"

service:
  type: ClusterIP
  port: 11434

ollama:
  host: "0.0.0.0:11434"
  keepAlive: "5m"

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

persistence:
  enabled: true
  size: 5Gi
  mountPath: /root/.ollama

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  liveness:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
