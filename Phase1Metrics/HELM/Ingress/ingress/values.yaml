ingress:
  enabled: true
  className: nginx

  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2

  hosts:
    - host: local.microservices.com
      paths:
        - path: /api(/|$)(.*)
          pathType: Prefix
          service:
            name: spring-service
            port: 8080

        - path: /python(/|$)(.*)
          pathType: Prefix
          service:
            name: python-service
            port: 8000

  tls: []

