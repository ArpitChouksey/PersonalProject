apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "python-service.fullname" . }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "python-service.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "python-service.name" . }}

    spec:
      containers:
        - name: python-service

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8000

          env:
            - name: DJANGO_DEBUG
              value: {{ .Values.env.DJANGO_DEBUG | quote }}

            # OpenTelemetry
            - name: OTEL_SERVICE_NAME
              value: "python-service"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.ns-tracing.svc.cluster.local:4318/v1/traces"

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            - name: OTEL_METRICS_EXPORTER
              value: "none"

            - name: OTEL_LOGS_EXPORTER
              value: "none"

          readinessProbe:
            httpGet:
              path: /hello/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /hello/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
