apiVersion: v1
kind: Service

metadata:
  name: {{ include "python-service.fullname" . }}

  labels:
    app: python-service

spec:
  type: {{ .Values.service.type }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP

  selector:
    app: {{ include "python-service.name" . }}
