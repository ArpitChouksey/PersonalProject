apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: spring-service-monitor
  namespace: monitoring
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: spring-service

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
