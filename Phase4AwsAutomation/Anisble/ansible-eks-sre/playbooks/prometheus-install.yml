---
- name: Install Prometheus Stack
  hosts: local

  tasks:

    - name: Create monitoring namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: monitoring
        state: present

    - name: Install kube-prometheus-stack
      kubernetes.core.helm:
        name: prometheus
        chart_ref: "{{ playbook_dir }}/../helm/metrics/kube-prometheus-stack"
        release_namespace: monitoring
        create_namespace: true
        values_files:
          - "{{ playbook_dir }}/../helm/metrics/kube-prometheus-stack/custom-values.yaml"
